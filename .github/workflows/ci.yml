name: CI

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: ctype, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml, zip, bcmath
          coverage: none
      - name: Prepare isolated configuration
        run: cp .env.example .env
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Validate Composer and PSR-4 loading
        run: |
          composer check-composer
          composer check-autoload
      - name: Audit Composer dependencies
        run: composer audit
      - name: Check installed runtime requirements
        run: composer check-platform-reqs
      - name: Prepare application
        run: |
          php artisan key:generate --ansi
          php artisan config:clear
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Build frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Check PHP formatting
        run: composer check-style
      - name: Run application tests
        run: vendor/bin/phpunit

  minimum-runtime:
    name: Production runtime (PHP 8.5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: ctype, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml, zip, bcmath
          coverage: none
      - run: cp .env.example .env
      - run: composer install --no-dev --no-interaction --no-progress --prefer-dist
      - run: composer check-platform-reqs --no-dev
      - name: Boot application on supported minimum
        run: |
          php artisan key:generate --ansi
          php artisan about --only=environment
          php artisan route:list --except-vendor

  dependency-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Audit locked frontend dependencies
        run: npm run audit

  postgres-migrations:
    name: PostgreSQL migration compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: avatarvault_test
          POSTGRES_USER: avatarvault
          POSTGRES_PASSWORD: testing-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: avatarvault_test
      DB_USERNAME: avatarvault
      DB_PASSWORD: testing-only
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: ctype, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_pgsql, tokenizer, xml, zip, bcmath
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Verify schema and legacy migration against PostgreSQL
        run: vendor/bin/phpunit --filter=LegacyMigrationTest

  docker-runtime:
    name: Docker production runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build locked application runtime
        run: docker build --tag avatarvault-runtime:ci .
      - name: Check production PHP platform requirements
        run: >-
          docker run --rm --entrypoint composer
          --volume "$PWD:/var/www/avatarvault:ro"
          avatarvault-runtime:ci check-platform-reqs --lock --no-dev
